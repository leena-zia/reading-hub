<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Book Recommendation Form</title>
    </head>
    <body>
    <header>
        <h1>Recommend a Book</h1>
    </header>
<main>

    <form>
        <p>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </p>
        <p>
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
         </p>
         <p>
        <label type="book">Your Favourite book</label>
        <input type="book" id="book" name="book" placeholder="Enter a book title" required>
        </p>
        <p>
        <label for="why">Why do you recommend it</label>
        <textarea id="why" name="why" rows="4" cols="4"></textarea>
        </p>
        <p>
        <button type="submit">Send</button>
        </p>
    </form>
</main>
<footer>
    <p>Leena's Reading Journey</p>
</footer>
</body>
</html>
